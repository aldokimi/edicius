plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'com.edicius.lwjgl3.Lwjgl3Launcher'
}

tasks.named('run') {
    workingDir = rootProject.file('assets')
    // Keep the process alive; closed stdin makes the JVM exit early under Gradle.
    standardInput = System.in
    ignoreExitValue = true
}

tasks.register('dist', Jar) {
    group = 'build'
    description = 'Desktop release jar with runtime dependencies'
    dependsOn classes
    archiveBaseName.set('edicius')
    archiveClassifier.set('desktop')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    from files(sourceSets.main.output.classesDirs)
    from files(sourceSets.main.output.resourcesDir)
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    doLast {
        copy {
            from rootProject.file('assets')
            into layout.buildDirectory.dir('dist/assets')
        }
        copy {
            from archiveFile
            into layout.buildDirectory.dir('dist')
        }
    }
}

eclipse.project.name = "${appName}-lwjgl3"
